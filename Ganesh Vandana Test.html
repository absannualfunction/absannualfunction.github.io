<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganesh–Saraswati Vandana</title>

  <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #150031;
      color: #fff;
    }

    /* ---------- WELCOME SCREEN ---------- */
    #welcome-screen {
      position: fixed;
      inset: 0;
      background: #150031;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: hideWelcome 1s ease forwards;
      animation-delay: 2.5s;
    }

    .welcome-content {
      text-align: center;
      animation: welcomePop 2s ease forwards;
    }

    .welcome-content h1,
    .welcome-content p {
      font-family: 'Allura', cursive;
      color: #ffdfb3;
    }

    .welcome-content h1 {
      font-size: 52px;
      margin-bottom: 10px;
    }

    .welcome-content p {
      font-size: 66px;
    }

    @keyframes welcomePop {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes hideWelcome {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* ---------- VIDEO ---------- */
    .video-container {
      position: relative;
      width: 100vw;
      aspect-ratio: 16 / 9;
      background: black;
      overflow: hidden;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ---------- OVERLAY ---------- */
    .video-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .play-button {
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid #ffdfb3;
      color: #ffdfb3;
      padding: 18px 30px;
      border-radius: 50px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .play-button span {
      font-size: 26px;
    }

    .fullscreen-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.65);
      color: #ffdfb3;
      border: 1px solid #ffdfb3;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .fullscreen-btn:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    /* ---------- MAIN CONTENT ---------- */
    .wrapper {
      max-width: 420px;
      margin: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .school-header img {
      width: 100%;
      height: auto;
    }

    h2 {
      text-align: center;
      color: bisque;
    }

    @media (min-width: 1024px) {
      .wrapper {
        max-width: 1200px;
      }
    }
  </style>
</head>

<body>

  <!-- WELCOME -->
  <div id="welcome-screen">
    <div class="welcome-content">
      <h1>Welcome to<br>Annie Besant School</h1>
      <p>Rewind 25</p>
    </div>
  </div>

  <!-- VIDEO -->
  <div class="video-container">
    <iframe
      id="driveVideo"
      src="https://drive.google.com/file/d/1cJMImkpTw4yTaSrL40s_L3l57CaSWKOw/preview"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>

    <div class="video-overlay" id="videoOverlay">
      <div class="play-button" id="playBtn">
        <span>▶</span> Tap to Play
      </div>

      <button class="fullscreen-btn" id="fsBtn">⛶</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="wrapper">
    <div class="school-header">
      <img src="School name png - Bigg.png" alt="School Name">
    </div>

    <h2>Ganesh–Saraswati Vandana</h2>
  </div>

  <!-- SCRIPT -->
  <script>
    const iframe = document.getElementById('driveVideo');
    const overlay = document.getElementById('videoOverlay');
    const playBtn = document.getElementById('playBtn');
    const fsBtn = document.getElementById('fsBtn');

    playBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      iframe.src = iframe.src + '?autoplay=1';
    });

    fsBtn.addEventListener('click', (e) => {
      e.stopPropagation();

      if (iframe.requestFullscreen) iframe.requestFullscreen();
      else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
      else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
    });
  </script>

</body>
</html>
